name: Contracts

on:
  pull_request:
    paths:
      - "contracts/**"
      - ".ai/**"
      - "scripts/**"
      - "requirements-agent.txt"
      - "requirements.lock"

permissions:
  contents: read

jobs:
  contract-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install hash-locked project dependencies
        run: python -m pip install --require-hashes -r requirements.lock
      - name: Validate project/task state
        run: |
          python scripts/agentctl.py project validate
          python scripts/agentctl.py task validate
      - name: Validate OpenAPI
        run: python scripts/validate-contracts.py
