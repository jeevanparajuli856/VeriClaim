name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install hash-locked project dependencies
        run: python -m pip install --require-hashes -r requirements.lock
      - name: Verify repository
        run: python scripts/agentctl.py verify
