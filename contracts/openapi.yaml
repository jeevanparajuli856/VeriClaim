openapi: 3.1.0

info:
  title: VeriClaim Local FHIR Anomaly Investigation Demo API
  version: 0.1.0
  description: >-
    Local synthetic-data demonstration API. Deterministic rules produce
    investigation signals; Vertex AI Gemini may add non-authoritative candidate
    explanations. The API does not determine fraud or make claim, payment,
    coverage, coding, medical-necessity, diagnostic, or clinical decisions.

servers:
  - url: http://127.0.0.1:8000
    description: Local development only

paths:
  /api/v1/analyze-demo:
    post:
      operationId: analyzeDemo
      summary: Analyze the fixed approved synthetic FHIR sample
      description: >-
        Loads the three repository-owned synthetic JSON inputs, performs bounded
        structural extraction and five deterministic checks, and makes at most
        one no-tools Gemini call. The operation accepts no body, upload, path, or
        remote URL. Deterministic results remain available when Gemini fails.
      security: []
      responses:
        "200":
          description: >-
            Deterministic analysis completed. Inspect gemini.status to determine
            whether validated candidate explanations are present.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalysisResponse"
        "500":
          description: >-
            The fixed source set could not be safely loaded or minimally
            extracted. Gemini was not called. The error is sanitized.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeterministicPipelineErrorResponse"

components:
  schemas:
    AnalysisResponse:
      type: object
      additionalProperties: false
      required:
        - analysis_id
        - source
        - observed_facts
        - rule_results
        - evidence_index
        - gemini
        - model_metadata
        - limitations
      properties:
        analysis_id:
          type: string
          minLength: 1
          maxLength: 128
          description: Application-generated identifier for this in-memory analysis.
        source:
          $ref: "#/components/schemas/SourceMetadata"
        observed_facts:
          type: array
          maxItems: 2000
          items:
            $ref: "#/components/schemas/ObservedFact"
        rule_results:
          type: array
          minItems: 5
          maxItems: 5
          items:
            $ref: "#/components/schemas/RuleResult"
        evidence_index:
          type: array
          maxItems: 2500
          items:
            $ref: "#/components/schemas/EvidenceRecord"
        gemini:
          oneOf:
            - $ref: "#/components/schemas/GeminiSuccess"
            - $ref: "#/components/schemas/GeminiFailure"
        model_metadata:
          $ref: "#/components/schemas/ModelMetadata"
        limitations:
          type: array
          minItems: 1
          maxItems: 20
          uniqueItems: true
          items:
            type: string
            minLength: 1
            maxLength: 500

    SourceMetadata:
      type: object
      additionalProperties: false
      required:
        - dataset_name
        - synthetic
        - files
        - resource_counts
      properties:
        dataset_name:
          type: string
          const: cms-blue-button-local-sample
        synthetic:
          type: boolean
          const: true
        files:
          type: array
          minItems: 3
          maxItems: 3
          items:
            $ref: "#/components/schemas/SourceFile"
        resource_counts:
          type: object
          additionalProperties: false
          required:
            - Patient
            - Coverage
            - ExplanationOfBenefit
          properties:
            Patient:
              type: integer
              minimum: 0
            Coverage:
              type: integer
              minimum: 0
            ExplanationOfBenefit:
              type: integer
              minimum: 0

    SourceFile:
      type: object
      additionalProperties: false
      required:
        - alias
        - path
        - sha256
        - size_bytes
      properties:
        alias:
          type: string
          enum:
            - patient
            - coverage
            - eob
        path:
          type: string
          enum:
            - dataset/patient_bbuser29999.json
            - dataset/coverage_bundle_bbuser29999.json
            - dataset/eob_bundle_bbuser29999.json
        sha256:
          type: string
          pattern: "^[a-f0-9]{64}$"
        size_bytes:
          type: integer
          minimum: 1
          maximum: 1048576

    ObservedFact:
      type: object
      additionalProperties: false
      required:
        - evidence_id
        - source_alias
        - json_pointer
        - fact_type
        - value
      properties:
        evidence_id:
          $ref: "#/components/schemas/FactEvidenceId"
        source_alias:
          type: string
          enum:
            - patient
            - coverage
            - eob
        json_pointer:
          type: string
          pattern: "^/"
          maxLength: 512
        fact_type:
          type: string
          enum:
            - resource_id
            - coverage_status
            - beneficiary_reference
            - coverage_period_start
            - coverage_period_end
            - patient_reference
            - coverage_reference
            - billable_period_start
            - billable_period_end
            - service_date
            - product_service_system
            - product_service_code
            - adjudication_value
            - adjudication_currency
        value:
          oneOf:
            - type: string
              maxLength: 2048
            - type: number
            - type: boolean

    RuleResult:
      type: object
      additionalProperties: false
      required:
        - rule_id
        - name
        - status
        - description
        - formula
        - parameters
        - signals
        - missing_evidence
        - limitations
      properties:
        rule_id:
          $ref: "#/components/schemas/RuleId"
        name:
          type: string
          minLength: 1
          maxLength: 160
        status:
          type: string
          enum:
            - completed
            - insufficient_evidence
        description:
          type: string
          minLength: 1
          maxLength: 500
        formula:
          type: string
          minLength: 1
          maxLength: 500
        parameters:
          type: object
          maxProperties: 20
          additionalProperties:
            oneOf:
              - type: string
                maxLength: 160
              - type: number
              - type: boolean
        signals:
          type: array
          maxItems: 500
          items:
            $ref: "#/components/schemas/DeterministicSignal"
        missing_evidence:
          type: array
          maxItems: 500
          uniqueItems: true
          items:
            type: string
            minLength: 1
            maxLength: 500
        limitations:
          type: array
          minItems: 1
          maxItems: 20
          uniqueItems: true
          items:
            type: string
            minLength: 1
            maxLength: 500

    DeterministicSignal:
      type: object
      additionalProperties: false
      required:
        - evidence_id
        - rule_id
        - signal_type
        - priority
        - message
        - evidence_refs
        - limitations
      properties:
        evidence_id:
          $ref: "#/components/schemas/SignalEvidenceId"
        rule_id:
          $ref: "#/components/schemas/RuleId"
        signal_type:
          type: string
          minLength: 1
          maxLength: 160
        priority:
          type: string
          enum:
            - information
            - review
        message:
          type: string
          minLength: 1
          maxLength: 500
        evidence_refs:
          type: array
          minItems: 1
          maxItems: 20
          uniqueItems: true
          items:
            $ref: "#/components/schemas/FactEvidenceId"
        limitations:
          type: array
          minItems: 1
          maxItems: 10
          uniqueItems: true
          items:
            type: string
            minLength: 1
            maxLength: 500

    EvidenceRecord:
      type: object
      additionalProperties: false
      required:
        - evidence_id
        - kind
        - summary
        - source_refs
      properties:
        evidence_id:
          type: string
          pattern: "^(ev:(patient|coverage|eob):/.*|sig:(REF-001|DATE-001|REPEAT-001|AMOUNT-001|OUTLIER-001):[0-9]{4})$"
          maxLength: 640
        kind:
          type: string
          enum:
            - fact
            - signal
        summary:
          type: string
          minLength: 1
          maxLength: 500
        source_refs:
          type: array
          maxItems: 20
          uniqueItems: true
          items:
            $ref: "#/components/schemas/FactEvidenceId"

    GeminiSuccess:
      type: object
      additionalProperties: false
      required:
        - status
        - summary
        - candidate_findings
        - missing_evidence
        - limitations
      properties:
        status:
          type: string
          const: success
        summary:
          type: string
          minLength: 1
          maxLength: 2000
        candidate_findings:
          type: array
          maxItems: 5
          items:
            $ref: "#/components/schemas/CandidateFinding"
        missing_evidence:
          type: array
          maxItems: 10
          uniqueItems: true
          items:
            type: string
            minLength: 1
            maxLength: 500
        limitations:
          type: array
          minItems: 1
          maxItems: 10
          uniqueItems: true
          items:
            type: string
            minLength: 1
            maxLength: 500

    GeminiFailure:
      type: object
      additionalProperties: false
      required:
        - status
        - message
        - candidate_findings
        - missing_evidence
        - limitations
      properties:
        status:
          type: string
          enum:
            - configuration_error
            - timeout
            - provider_error
            - invalid_output
            - invalid_evidence
        message:
          type: string
          minLength: 1
          maxLength: 500
          description: Sanitized public failure message; never raw provider text.
        candidate_findings:
          type: array
          maxItems: 0
        missing_evidence:
          type: array
          maxItems: 10
          uniqueItems: true
          items:
            type: string
            minLength: 1
            maxLength: 500
        limitations:
          type: array
          minItems: 1
          maxItems: 10
          uniqueItems: true
          items:
            type: string
            minLength: 1
            maxLength: 500

    CandidateFinding:
      type: object
      additionalProperties: false
      required:
        - title
        - explanation
        - evidence_refs
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 160
        explanation:
          type: string
          minLength: 1
          maxLength: 1000
        evidence_refs:
          type: array
          minItems: 1
          maxItems: 10
          uniqueItems: true
          items:
            type: string
            pattern: "^(ev:(patient|coverage|eob):/.*|sig:(REF-001|DATE-001|REPEAT-001|AMOUNT-001|OUTLIER-001):[0-9]{4})$"
            maxLength: 640

    ModelMetadata:
      type: object
      additionalProperties: false
      required:
        - provider
        - sdk
        - model
        - prompt_version
        - response_schema_version
        - invoked
        - call_count
        - output_validated
        - latency_ms
        - input_tokens
        - output_tokens
      properties:
        provider:
          type: string
          const: vertex-ai
        sdk:
          type: string
          const: google-genai
        model:
          type:
            - string
            - "null"
          maxLength: 160
        prompt_version:
          type: string
          minLength: 1
          maxLength: 64
        response_schema_version:
          type: string
          minLength: 1
          maxLength: 64
        invoked:
          type: boolean
        call_count:
          type: integer
          minimum: 0
          maximum: 1
        output_validated:
          type: boolean
        latency_ms:
          type:
            - integer
            - "null"
          minimum: 0
        input_tokens:
          type:
            - integer
            - "null"
          minimum: 0
        output_tokens:
          type:
            - integer
            - "null"
          minimum: 0

    DeterministicPipelineErrorResponse:
      type: object
      additionalProperties: false
      required:
        - error
      properties:
        error:
          $ref: "#/components/schemas/DeterministicPipelineError"

    DeterministicPipelineError:
      type: object
      additionalProperties: false
      required:
        - code
        - message
        - model_called
      properties:
        code:
          type: string
          enum:
            - SOURCE_UNAVAILABLE
            - SOURCE_TOO_LARGE
            - SOURCE_INVALID_JSON
            - SOURCE_SHAPE_UNSUPPORTED
            - EXTRACTION_LIMIT_EXCEEDED
        message:
          type: string
          minLength: 1
          maxLength: 500
        model_called:
          type: boolean
          const: false

    RuleId:
      type: string
      enum:
        - REF-001
        - DATE-001
        - REPEAT-001
        - AMOUNT-001
        - OUTLIER-001

    FactEvidenceId:
      type: string
      pattern: "^ev:(patient|coverage|eob):/.*$"
      maxLength: 640

    SignalEvidenceId:
      type: string
      pattern: "^sig:(REF-001|DATE-001|REPEAT-001|AMOUNT-001|OUTLIER-001):[0-9]{4}$"
      maxLength: 64
